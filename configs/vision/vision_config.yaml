# Vision Module Configuration
# CNN-based visual condition encoder for Pokemon card grading

vision_module:
  # Model architecture
  model:
    backbone: "resnet50"  # Options: resnet18, resnet50, efficientnet_b0
    pretrained: true
    freeze_early_layers: true  # Freeze first 2 blocks
    embedding_dim: 256  # Visual condition embedding size
    num_classes: 3  # PSA grades: 8, 9, 10 (high-grade focus)
  
  # Training parameters
  training:
    batch_size: 16
    num_epochs: 30
    learning_rate: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 7
    
    # Data augmentation
    augmentation:
      train:
        random_rotation: 15  # degrees
        random_brightness: 0.2
        random_contrast: 0.2
        random_horizontal_flip: true
      
      val_test:
        # No augmentation for validation/test
        resize: 224
        center_crop: 224
  
  # Data splits
  data:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    random_seed: 42
    
    # Image preprocessing
    image_size: 224
    normalize_mean: [0.485, 0.456, 0.406]  # ImageNet stats
    normalize_std: [0.229, 0.224, 0.225]
  
  # Paths
  paths:
    images_dir: "data/raw/images/scraped"
    cards_metadata: "data/processed/cards_filtered.parquet"  # PSA 8-10 only
    output_dir: "models/vision"
    embeddings_dir: "data/embeddings"
    checkpoints_dir: "models/vision/checkpoints"
  
  # Evaluation
  evaluation:
    metrics:
      - "accuracy"
      - "mae"  # Mean Absolute Error for grade prediction
      - "confusion_matrix"
    
    # Grade mapping (PSA 8-10 only)
    grade_mapping:
      8: 0
      9: 1
      10: 2
