# Fusion Module Configuration
# Multimodal fusion network combining visual and market embeddings

fusion_module:
  # Model architecture
  model:
    type: "mlp"  # Options: mlp, linear, gradient_boosting

    # MLP parameters
    mlp:
      hidden_layers: [128, 64, 32]
      activation: "relu"
      dropout: 0.3
      batch_norm: true

    # Output
    output:
      type: "probabilistic"  # Predict mean and variance
      uncertainty_estimation: true

  # Training parameters
  training:
    batch_size: 4
    num_epochs: 100
    learning_rate: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 15

    # Data splits
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

  # Fusion strategy
  fusion:
    strategy: "concatenate"  # Options: concatenate, attention, gated
    normalize_embeddings: true

    # Embedding sources
    visual_embedding_dim: 256
    market_embedding_dim: 28  # Actual dim from market module

  # Evaluation
  evaluation:
    metrics:
      - "mae"
      - "rmse"
      - "mape"
      - "r2"
      - "calibration"  # Uncertainty calibration

  # Paths
  paths:
    visual_embeddings: "data/embeddings/visual_embeddings.parquet"
    market_embeddings: "data/embeddings/market_embeddings.parquet"
    output_dir: "models/fusion"
    results_dir: "results/fusion"

  # Random seed
  random_seed: 42
